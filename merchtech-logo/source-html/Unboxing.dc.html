<style>
body{margin:0;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;background:#F4F1EA}
.scene{animation:scene 6s linear infinite}
.mark{animation:drop 6s cubic-bezier(.2,.9,.3,1) infinite}
.body{animation:squash 6s ease-out infinite}
.shadow{animation:shadow 6s ease-out infinite}
.lid{animation:lid 6s cubic-bezier(.3,1.5,.4,1) infinite}
.spark{animation:spark 6s ease-out infinite}
.spark:nth-child(2){animation-name:spark2}
.spark:nth-child(3){animation-name:spark3}
.spark:nth-child(4){animation-name:spark4}
.l{animation-duration:6s;animation-timing-function:cubic-bezier(.2,.9,.3,1);animation-iteration-count:infinite}
.l:nth-child(1){animation-name:l1}.l:nth-child(2){animation-name:l2}.l:nth-child(3){animation-name:l3}
.l:nth-child(4){animation-name:l4}.l:nth-child(5){animation-name:l5}.l:nth-child(6){animation-name:l6}
.l:nth-child(7){animation-name:l7}.l:nth-child(8){animation-name:l8}.l:nth-child(9){animation-name:l9}
.tag{animation:tag 6s linear infinite}
@keyframes scene{0%,90%{opacity:1}97%,100%{opacity:0}}
@keyframes drop{0%{transform:translateY(-160px);opacity:0}11%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes squash{0%,11%{transform:scale(1,1)}13%{transform:scale(1.07,.9)}17%,100%{transform:scale(1,1)}}
@keyframes shadow{0%{transform:scale(.4);opacity:0}11%{transform:scale(1.08);opacity:1}17%,100%{transform:scale(1);opacity:1}}
@keyframes lid{0%,11%{transform:translateY(0) rotate(0deg)}13%{transform:translateY(-10px) rotate(0deg)}17%,24%{transform:translateY(0) rotate(0deg)}36%,100%{transform:translateY(-26px) rotate(-14deg)}}
@keyframes spark{0%,28%{transform:scale(0);opacity:0}36%{transform:scale(1) translate(0,0);opacity:1}52%,100%{transform:scale(.4) translate(10px,-26px);opacity:0}}
@keyframes spark2{0%,30%{transform:scale(0);opacity:0}38%{transform:scale(1) translate(0,0);opacity:1}54%,100%{transform:scale(.4) translate(18px,-14px);opacity:0}}
@keyframes spark3{0%,29%{transform:scale(0);opacity:0}37%{transform:scale(1) translate(0,0);opacity:1}53%,100%{transform:scale(.4) translate(-8px,-30px);opacity:0}}
@keyframes spark4{0%,31%{transform:scale(0);opacity:0}39%{transform:scale(1) translate(0,0);opacity:1}55%,100%{transform:scale(.4) translate(22px,-24px);opacity:0}}
@keyframes l1{0%,40%{opacity:0;transform:translateY(48px)}45%,100%{opacity:1;transform:translateY(0)}}
@keyframes l2{0%,41.6%{opacity:0;transform:translateY(48px)}46.6%,100%{opacity:1;transform:translateY(0)}}
@keyframes l3{0%,43.2%{opacity:0;transform:translateY(48px)}48.2%,100%{opacity:1;transform:translateY(0)}}
@keyframes l4{0%,44.8%{opacity:0;transform:translateY(48px)}49.8%,100%{opacity:1;transform:translateY(0)}}
@keyframes l5{0%,46.4%{opacity:0;transform:translateY(48px)}51.4%,100%{opacity:1;transform:translateY(0)}}
@keyframes l6{0%,48%{opacity:0;transform:translateY(48px)}53%,100%{opacity:1;transform:translateY(0)}}
@keyframes l7{0%,49.6%{opacity:0;transform:translateY(48px)}54.6%,100%{opacity:1;transform:translateY(0)}}
@keyframes l8{0%,51.2%{opacity:0;transform:translateY(48px)}56.2%,100%{opacity:1;transform:translateY(0)}}
@keyframes l9{0%,52.8%{opacity:0;transform:translateY(48px)}57.8%,100%{opacity:1;transform:translateY(0)}}
@keyframes tag{0%,58%{width:0;animation-timing-function:steps(34,end)}72%,100%{width:430px}}
</style>
</helmet>

<div class="spark" style="position: absolute; left: 128px; top: 40px; width: 6px; height: 6px; border-radius: 50%; background: {{accent}};"></div>

<span class="l" style="color: #17181C;">m</span><span class="l" style="color: #17181C;">e</span><span class="l" style="color: #17181C;">r</span><span class="l" style="color: #17181C;">c</span><span class="l" style="color: #17181C;">h</span><span class="l" style="color: {{accent}};">t</span><span class="l" style="color: {{accent}};">e</span><span class="l" style="color: {{accent}};">c</span><span class="l" style="color: {{accent}};">h</span>
</div>
